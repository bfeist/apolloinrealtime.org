# nginx redirect config snippet for apolloinrealtime.org
# Add inside the server {} block, before the root location / handler.
# Handles retired routes (mobile subfolders + A13 spacecraft_dev + A17 nominee).

# Mobile subfolder redirects (decision B5 — unified responsive app)
location ~ ^/(11|13|17)/mobile/(.*)$ {
    return 301 /$1/;
}

# A13 spacecraft_dev (decision B6 — discarded)
location ~ ^/13/spacecraft_dev/(.*)$ {
    return 301 /13/;
}

# A17 nominee (decision B6 — retired)
location ~ ^/17/nominee/(.*)$ {
    return 301 /17/;
}
